{% macro ingredient_row(key, ing) %}
<div class="row ingredient-row">
  <input type="hidden" name="ing_key" value="{{ key }}">
  <label class="main-radio" title="Главный ингредиент">
    <input type="radio" name="main" value="{{ key }}" {{ 'checked' if ing and ing.is_main }}><span>★</span>
  </label>
  <input type="text" name="ing_name" placeholder="Ингредиент" value="{{ ing.name if ing else '' }}">
  <input type="text" inputmode="decimal" name="ing_qty" class="qty-input" placeholder="Кол-во"
         value="{{ ing|qty_input if ing else '' }}">
  <select name="ing_unit">
    {% for code, label in units.items() %}
      <option value="{{ code }}" {{ 'selected' if ing and ing.unit == code }}>{{ label }}</option>
    {% endfor %}
  </select>
  <button type="button" class="remove" title="Удалить">✕</button>
</div>
{% endmacro %}

{% macro step_row(text) %}
<li class="row step-row">
  <textarea name="step" rows="2" placeholder="Опишите шаг">{{ text }}</textarea>
  <button type="button" class="remove" title="Удалить">✕</button>
</li>
{% endmacro %}
