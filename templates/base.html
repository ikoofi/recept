<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Книга рецептов{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='icon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">📖 Книга рецептов</a>
    <nav class="nav">
      <a href="{{ url_for('import_recipes') }}">Импорт</a>
      <a href="{{ url_for('export_all') }}">Экспорт всех</a>
      <a class="btn" href="{{ url_for('recipe_new') }}">+ Добавить рецепт</a>
      {% if config.LAUNCHER %}
        <form method="post" action="{{ url_for('quit_app') }}" class="quit"
              onsubmit="return confirm('Закрыть книгу рецептов?')">
          <button title="Остановить программу">Выход</button>
        </form>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
